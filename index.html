<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pomodoro Timer</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app" aria-labelledby="app-title">
      <h1 id="app-title">Pomodoro Timer</h1>

      <section class="timer-card" aria-label="Timer">
        <p class="mode" id="mode-label">Focus</p>
        <p class="time" id="time-display" aria-live="polite">25:00</p>

        <div class="controls" aria-label="Timer controls">
          <button type="button">Start</button>
          <button type="button">Pause</button>
          <button type="button">Reset</button>
        </div>
      </section>

      <section class="settings" aria-label="Session lengths">
        <div class="setting-row">
          <label for="focus-minutes">Focus (minutes)</label>
          <input id="focus-minutes" type="number" min="1" max="90" value="25" />
        </div>

        <div class="setting-row">
          <label for="break-minutes">Break (minutes)</label>
          <input id="break-minutes" type="number" min="1" max="30" value="5" />
        </div>
      </section>
    </main>
  </body>
</html>
